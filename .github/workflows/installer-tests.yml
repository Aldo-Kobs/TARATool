name: Installer and launcher

on:
  push:
    paths:
      - install.py
      - scripts/server.py
      - tests/test_installer.py
      - tests/test_folder_storage.py
      - .github/workflows/installer-tests.yml
  pull_request:
    paths:
      - install.py
      - scripts/server.py
      - tests/test_installer.py
      - tests/test_folder_storage.py
      - .github/workflows/installer-tests.yml

permissions:
  contents: read

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Installer regression tests (no third-party packages)
        run: python -m unittest discover -s tests -p test_installer.py -v
      - name: Local persistence regression tests
        run: python -m unittest discover -s tests -p test_folder_storage.py -v
